name: Construire la préproduction Windows

on:
  workflow_dispatch:
    inputs:
      native_windows:
        description: Run the isolated native installer test instead of the beta build
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    if: inputs.native_windows == true
    uses: ./.github/workflows/validate-windows-native.yml
  windows:
    if: inputs.native_windows != true
    name: Candidat interne non publié
    runs-on: windows-latest
    env:
      VITE_SCENARIO_API_BASE_URL: https://scenario-commercial-api-preproduction.ore-picard.workers.dev
      VITE_SCENARIO_ENVIRONMENT: staging
      VITE_SCENARIO_AUTH_MODE: supabase
      VITE_SUPABASE_URL: https://zblnsdyaoljnezxdidtx.supabase.co
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY_PREPRODUCTION }}
      VITE_SCENARIO_BILLING_RETURN_URL: https://senario-app-preproduction.pages.dev/
      VITE_SCENARIO_PUBLIC_APP_URL: https://senario-app-preproduction.pages.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier l’application
        run: npm test -- --run
      - name: Construire le candidat préproduction
        run: npm run build:beta
      - name: Conserver le candidat comme artefact interne
        uses: actions/upload-artifact@v4
        with:
          name: senario-preproduction-windows
          path: src-tauri/target/release/bundle/nsis/senario Beta_*_x64-setup.exe
          if-no-files-found: error
          retention-days: 7
