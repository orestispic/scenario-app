name: Publier Senario pour Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Installateur et mise à jour Windows
    runs-on: windows-latest
    env:
      VITE_SCENARIO_API_BASE_URL: https://scenario-commercial-api-preproduction.ore-picard.workers.dev
      VITE_SUPABASE_URL: https://zblnsdyaoljnezxdidtx.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_tAI1UPbu2UnelkOeuI1WNg_hPegJP4Y
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier l’application
        run: npm test -- --run
      - name: Construire la version signée en brouillon
        id: build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Senario __VERSION__
          releaseBody: |
            Version bêta de Senario pour Windows 10 et 11 (64 bits).
            Téléchargez Scenario-Setup.exe puis suivez les étapes de l’installateur.
          releaseDraft: true
          prerelease: false
          args: --config src-tauri/tauri.preproduction.conf.json --bundles nsis
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          releaseAssetNamePattern: Scenario-Setup[ext]
      - name: Vérifier la signature de l’installateur
        run: node scripts/verify-updater-release.mjs
      - name: Vérifier installation, mise à jour et réinstallation Windows
        shell: pwsh
        run: ./scripts/phase14-windows-lifecycle.ps1 -Installer 'src-tauri/target/release/bundle/nsis/senario Beta_0.1.12_x64-setup.exe'
      - name: Publier uniquement après les tests Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit ${{ github.ref_name }} --draft=false --latest
